<!-- CALCULATOR TAB -->
<section class="section" id="tab-calc">
  <div class="page-title" style="margin-bottom: 24px;">Смета и расчет проекта</div>
  
  <div class="calc-wizard">
    <!-- Блок 1: Исходные данные -->
    <div class="wizard-step">
      <div class="step-header">
        <div class="step-num">1</div>
        <div class="step-title">Параметры и габариты</div>
      </div>
      <div class="step-body">
        <div class="form-row-3">
          <div class="form-group">
            <label>Среда использования</label>
            <select id="w_env" onchange="window.updateCalc()">
              <option value="indoor">Внутренний (Indoor)</option>
              <option value="outdoor">Уличный (Outdoor)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Желаемая ширина (м)</label>
            <input type="number" id="w_width" value="3.0" step="0.1" min="0.1" oninput="window.updateCalc()">
          </div>
          <div class="form-group">
            <label>Желаемая высота (м)</label>
            <input type="number" id="w_height" value="2.0" step="0.1" min="0.1" oninput="window.updateCalc()">
          </div>
        </div>
      </div>
    </div>

    <!-- Блок 2: Оборудование -->
    <div class="wizard-step">
      <div class="step-header">
        <div class="step-num">2</div>
        <div class="step-title">Выбор комплектующих</div>
      </div>
      <div class="step-body">
        <div class="form-row-2">
          <div class="form-group">
            <label>Модуль LED</label>
            <select id="w_mod" onchange="window.updateCalc()"></select>
            <div id="w_mod_hints" class="hint-box"></div>
          </div>
          <div class="form-group">
            <label>Контроллер управления</label>
            <select id="w_ctrl" onchange="window.updateCalc()"></select>
            <div id="w_ctrl_hints" class="hint-box"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Блок 3: Услуги и Наценки -->
    <div class="wizard-step">
      <div class="step-header">
        <div class="step-num">3</div>
        <div class="step-title">Услуги и экономика</div>
      </div>
      <div class="step-body">
        <div class="form-row-4">
          <div class="form-group">
            <label>Каркас (UAH)</label>
            <input type="number" id="w_frame" value="12000" min="0" oninput="window.updateCalc()">
          </div>
          <div class="form-group">
            <label>Доставка (UAH)</label>
            <input type="number" id="w_delivery" value="1500" min="0" oninput="window.updateCalc()">
          </div>
          <div class="form-group">
            <label>Монтаж / ПНР (UAH)</label>
            <input type="number" id="w_setup" value="10000" min="0" oninput="window.updateCalc()">
          </div>
          <div class="form-group">
            <label>Скидка на ПНР (UAH)</label>
            <input type="number" id="w_discount" value="0" min="0" oninput="window.updateCalc()">
          </div>
        </div>
        <div class="form-row-2" style="margin-top: 16px; border-top: 1px dashed var(--border); padding-top: 16px;">
          <div class="form-group">
            <label>Наценка на материалы (%)</label>
            <input type="number" id="w_markup_mat" value="25" min="0" max="200" oninput="window.updateCalc()">
          </div>
          <div class="form-group">
            <label>Курс USD (UAH)</label>
            <input type="number" id="w_usd_rate" value="41.2" step="0.1" oninput="window.updateCalc()">
          </div>
        </div>
      </div>
    </div>

    <!-- Блок 4: Итоговая смета (Receipt) -->
    <div class="wizard-receipt">
      <div class="receipt-header">Спецификация и расчет стоимости</div>
      
      <!-- Tech bar -->
      <div class="tech-bar">
        <div class="tech-item"><div class="tl">Размер (мм)</div><div class="tv" id="r_size">—</div></div>
        <div class="tech-item"><div class="tl">Матрица мод.</div><div class="tv" id="r_matrix">—</div></div>
        <div class="tech-item"><div class="tl">Разрешение</div><div class="tv" id="r_res">—</div></div>
        <div class="tech-item"><div class="tl">Пикселей</div><div class="tv" id="r_px">—</div></div>
        <div class="tech-item"><div class="tl">P_Max / P_Avg</div><div class="tv" id="r_power">—</div></div>
      </div>

      <table class="receipt-table">
        <thead>
          <tr>
            <th>Наименование</th>
            <th class="text-center">Кол-во</th>
            <th class="text-right">Цена (UAH)</th>
            <th class="text-right">Сумма (UAH)</th>
          </tr>
        </thead>
        <tbody id="receipt_body"></tbody>
        <tfoot>
          <tr class="receipt-total">
            <td colspan="3">ИТОГО К ОПЛАТЕ:</td>
            <td class="text-right" id="receipt_total">0 ₴</td>
          </tr>
        </tfoot>
      </table>
    </div>

  </div>
</section>

<!-- CSS for Wizard -->
<style>
.calc-wizard {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 32px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 32px;
}
.wizard-step { display: flex; flex-direction: column; gap: 16px; }
.step-header { display: flex; align-items: center; gap: 12px; border-bottom: 2px solid var(--bg2); padding-bottom: 8px; }
.step-num { 
  background: var(--accent); color: #fff; width: 28px; height: 28px; 
  display: flex; align-items: center; justify-content: center; 
  border-radius: 50%; font-weight: 700; font-size: 14px;
}
.step-title { font-size: 18px; font-weight: 700; color: var(--text); }
.step-body { padding-left: 40px; }

.form-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.form-row-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.form-row-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 768px) {
  .form-row-3, .form-row-2, .form-row-4 { grid-template-columns: 1fr; }
  .step-body { padding-left: 0; margin-top: 12px; }
}

.hint-box { margin-top: 8px; font-size: 13px; color: var(--text3); background: var(--bg2); padding: 8px 12px; border-radius: 6px; border-left: 3px solid var(--accent); }

/* Receipt Section */
.wizard-receipt {
  margin-top: 16px; background: #f8fafc; border: 1px solid #e2e8f0;
  border-radius: 12px; padding: 24px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
}
.receipt-header { font-size: 18px; font-weight: 800; color: #0f172a; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }

.tech-bar {
  display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 24px;
  background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px;
}
.tech-item { flex: 1; min-width: 120px; }
.tl { font-size: 11px; text-transform: uppercase; color: #64748b; font-weight: 600; margin-bottom: 4px; }
.tv { font-size: 15px; font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #0ea5e9; }

.receipt-table { width: 100%; border-collapse: collapse; }
.receipt-table th, .receipt-table td { padding: 12px 8px; border-bottom: 1px solid #e2e8f0; font-size: 14px; color: #334155; }
.receipt-table th { color: #64748b; text-transform: uppercase; font-size: 11px; text-align: left; font-weight: 600; }
.text-center { text-align: center !important; }
.text-right { text-align: right !important; }
.receipt-total td { font-weight: 800; font-size: 18px; color: #0f172a; border-top: 2px solid #cbd5e1; border-bottom: none; padding-top: 16px; }
#receipt_total { color: #059669; font-size: 22px; }
.ri-name { font-weight: 600; color: #0f172a; display: block; }
.ri-desc { font-size: 12px; color: #64748b; margin-top: 2px; }
</style>

<script type="module">
import { DB } from './js/data/database.js';

let currentEnv = 'indoor';

function init() {
  // Set default values from DB
  document.getElementById('w_usd_rate').value = DB.config.usdRate;
  document.getElementById('w_markup_mat').value = DB.config.markupMaterials;
  document.getElementById('w_frame').value = DB.prices.fixedCosts.frameUAH;
  document.getElementById('w_delivery').value = DB.prices.fixedCosts.deliveryUAH;
  document.getElementById('w_setup').value = DB.prices.fixedCosts.commissioningUAH + DB.prices.fixedCosts.installUAH;
  
  updateLists();
  window.updateCalc = updateCalc; // Expose to global for onchange
}

function updateLists() {
  currentEnv = document.getElementById('w_env').value;
  
  // Update Modules
  const modSelect = document.getElementById('w_mod');
  const prevMod = modSelect.value;
  modSelect.innerHTML = '';
  DB.matrices.filter(m => m.location === currentEnv).forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.id;
    opt.textContent = `${m.model} (${m.moduleW}x${m.moduleH}mm) - $${m.priceUSD}`;
    modSelect.appendChild(opt);
  });
  if (prevMod && [...modSelect.options].some(o => o.value === prevMod)) {
    modSelect.value = prevMod;
  }
  
  // Update Controllers
  const ctrlSelect = document.getElementById('w_ctrl');
  const prevCtrl = ctrlSelect.value;
  ctrlSelect.innerHTML = '';
  DB.controllers.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = `${c.manufacturer} ${c.model} (до ${(c.maxPixels/1000000).toFixed(1)}M px)`;
    ctrlSelect.appendChild(opt);
  });
  if (prevCtrl && [...ctrlSelect.options].some(o => o.value === prevCtrl)) {
    ctrlSelect.value = prevCtrl;
  }
  
  updateCalc();
}

function updateCalc() {
  // Check if env changed
  const newEnv = document.getElementById('w_env').value;
  if (newEnv !== currentEnv) {
    updateLists();
    return;
  }

  const modId = document.getElementById('w_mod').value;
  const ctrlId = document.getElementById('w_ctrl').value;
  const mod = DB.matrices.find(m => m.id === modId);
  const ctrl = DB.controllers.find(c => c.id === ctrlId);
  if (!mod || !ctrl) return;

  // Render Hints
  document.getElementById('w_mod_hints').innerHTML = `<b>Яркость:</b> ${mod.brightness} nits | <b>Защита:</b> ${mod.ip} | <b>Технология:</b> ${mod.technology}`;
  document.getElementById('w_ctrl_hints').innerHTML = `<b>Тип:</b> ${ctrl.type} | <b>Порты:</b> ${ctrl.ethernetPorts} | <b>Облако:</b> ${ctrl.cloud ? 'Да' : 'Нет'}`;

  // Inputs
  const w_m = parseFloat(document.getElementById('w_width').value) || 0;
  const h_m = parseFloat(document.getElementById('w_height').value) || 0;
  const usdRate = parseFloat(document.getElementById('w_usd_rate').value) || 40.0;
  const markup = 1 + ((parseFloat(document.getElementById('w_markup_mat').value) || 0) / 100);

  // Geometry
  const cols = Math.round((w_m * 1000) / mod.moduleW) || 1;
  const rows = Math.round((h_m * 1000) / mod.moduleH) || 1;
  const totalMods = cols * rows;
  
  const realW = cols * mod.moduleW;
  const realH = rows * mod.moduleH;
  
  // Resolution per module (calculate via pitch if not provided in DB)
  // pixel count = dimension / pitch
  const modResW = Math.round(mod.moduleW / mod.pitch);
  const modResH = Math.round(mod.moduleH / mod.pitch);
  const resW = cols * modResW;
  const resH = rows * modResH;
  const totalPx = resW * resH;

  // Power
  const maxPwrW = totalMods * mod.maxPowerPerModule;
  const avgPwrW = maxPwrW * 0.35; // 35% typical

  // Update Tech Bar
  document.getElementById('r_size').textContent = `${realW} × ${realH}`;
  document.getElementById('r_matrix').textContent = `${cols}×${rows} (${totalMods}шт)`;
  document.getElementById('r_res').textContent = `${resW} × ${resH}`;
  document.getElementById('r_px').textContent = totalPx.toLocaleString('ru');
  document.getElementById('r_power').textContent = `${(maxPwrW/1000).toFixed(1)} / ${(avgPwrW/1000).toFixed(1)} кВт`;

  // Hardware Quantities
  const psuW = DB.prices.psu.watts * DB.prices.psu.usageFactor;
  const psuCount = Math.ceil(maxPwrW / psuW) || 1;
  
  // Cabinet size estimation for receiving cards (roughly 1 card per typical cabinet size, e.g. 640x640)
  // We'll estimate 1 card per cabinet area or just 1 per X modules.
  const modsPerCabW = Math.round(mod.cabinetW / mod.moduleW) || 1;
  const modsPerCabH = Math.round(mod.cabinetH / mod.moduleH) || 1;
  const modsPerCab = modsPerCabW * modsPerCabH;
  const rCardCount = Math.ceil(totalMods / modsPerCab) || 1;
  
  const dataCableCount = totalMods;
  const pwrCableCount = Math.ceil(totalMods / 2);

  // Prices UAH with markup
  const toUAH = (usd) => (usd * usdRate * markup);
  const pMod = toUAH(mod.priceUSD);
  const pPsu = toUAH(DB.prices.psu.priceUSD);
  const pRCard = toUAH(DB.prices.receivingCard.priceUSD);
  const pCtrl = toUAH(ctrl.priceUSD);
  const pData = toUAH(DB.prices.cables.dataRibbonUSD);
  const pPwr = toUAH(DB.prices.cables.powerUSD);

  // Sums
  const sMod = pMod * totalMods;
  const sPsu = pPsu * psuCount;
  const sRCard = pRCard * rCardCount;
  const sData = pData * dataCableCount;
  const sPwr = pPwr * pwrCableCount;

  const frameUAH = (parseFloat(document.getElementById('w_frame').value) || 0) * markup;
  const delivUAH = (parseFloat(document.getElementById('w_delivery').value) || 0) * markup;
  const setupRaw = (parseFloat(document.getElementById('w_setup').value) || 0) * markup;
  const discUAH = parseFloat(document.getElementById('w_discount').value) || 0;
  const setupUAH = Math.max(0, setupRaw - discUAH);

  const total = sMod + sPsu + sRCard + pCtrl + sData + sPwr + frameUAH + delivUAH + setupUAH;

  // Render Table
  let html = '';
  function tr(name, desc, qty, price, sum) {
    if (qty > 0 || sum > 0) {
      html += `<tr>
        <td><span class="ri-name">${name}</span><span class="ri-desc">${desc}</span></td>
        <td class="text-center">${qty} шт</td>
        <td class="text-right">${Math.round(price).toLocaleString('ru')}</td>
        <td class="text-right"><b>${Math.round(sum).toLocaleString('ru')}</b></td>
      </tr>`;
    }
  }

  tr('LED Модули', `${mod.model} (${mod.moduleW}x${mod.moduleH})`, totalMods, pMod, sMod);
  tr('Блоки питания', DB.prices.psu.label, psuCount, pPsu, sPsu);
  tr('Принимающие карты', DB.prices.receivingCard.label, rCardCount, pRCard, sRCard);
  tr('Шлейфы данных', 'Data ribbon', dataCableCount, pData, sData);
  tr('Кабели питания', '5V wire', pwrCableCount, pPwr, sPwr);
  tr('Контроллер экрана', `${ctrl.manufacturer} ${ctrl.model}`, 1, pCtrl, pCtrl);
  
  if (frameUAH > 0) tr('Каркас', 'Сборная металлоконструкция', 1, frameUAH, frameUAH);
  if (delivUAH > 0) tr('Доставка', 'Транспортные услуги', 1, delivUAH, delivUAH);
  if (setupRaw > 0) {
    const dStr = discUAH > 0 ? ` (скидка -${discUAH} ₴)` : '';
    tr('ПНР и Монтаж', 'Пусконаладочные работы' + dStr, 1, setupUAH, setupUAH);
  }

  document.getElementById('receipt_body').innerHTML = html;
  document.getElementById('receipt_total').textContent = Math.round(total).toLocaleString('ru') + ' ₴';
}

document.addEventListener('DOMContentLoaded', init);
</script>
